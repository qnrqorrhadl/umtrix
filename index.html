    /* 레이아웃: 화면 가운데에 양옆 벽이 있는 좁은 판, 위쪽에 얇은 조작 막대 하나 */
  :root {
    --bg: #14161c;
    --fg: #e8eaf0;
    --muted: #8a90a0;
    --line: #2a2e3a;
    --accent: #ffd23f;
    --accent-ink: #14161c;
    --font-display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-body: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: manipulation;
  }
  #bar {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding-top: 12px;
    pointer-events: none;
  }
  #bar > * { pointer-events: auto; }
  #hint {
    flex: 1 1 240px;
    min-width: 0;
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
  }
  kbd {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    color: var(--fg);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btns button { white-space: nowrap; flex-shrink: 0; }
  @media (max-width: 480px) { .btns { gap: 6px; } .btns button { padding: 0 11px; } #score { min-width: 3.4em; } }
  button {
    font: 700 14px var(--font-body);
    min-height: 40px;
    padding: 0 16px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #score {
    font: 700 18px var(--font-body);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 4.5em;
    text-align: right;
  }
  /* 터치 화면에서만 보이는 조작 버튼 */
  #pad {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    gap: 10px;
    box-sizing: border-box;
    padding-top: 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    border-top: 1px solid var(--line);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #pad button { flex: 1; min-height: 52px; font-size: 20px; touch-action: none; }
  #pad #drop2 { flex: 2; font-size: 16px; }
  @media (hover: none) and (pointer: coarse) { #pad { display: flex; } }

  /* 메인화면: 조작 막대와 버튼은 숨기고 제목만 보여줌 */
  body.menu #bar, body.menu #pad { display: none !important; }
  #title {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding-inline: 16px;
    box-sizing: border-box;
    text-align: center;
    pointer-events: none;
  }
  body.menu #title { display: flex; }
  #title h1 {
    margin: 0;
    font: 400 clamp(64px, 17vw, 168px)/1 var(--font-display);
    letter-spacing: 0.02em;
    text-shadow: 0 5px 0 rgba(0, 0, 0, 0.35), 0 0 48px rgba(20, 22, 28, 0.95);
  }
  #ver { position: fixed; right: 14px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 500 12px var(--font-body); color: var(--muted); opacity: 0.7; }
  #title h1 span:nth-child(1) { color: #ff5d73; }
  #title h1 span:nth-child(2) { color: #ffd23f; }
  #title h1 span:nth-child(3) { color: #3ddc97; }
  #title h1 span:nth-child(4) { color: #4cc9f0; }
  #title p {
    margin: 0;
    font: 700 clamp(14px, 2vw, 19px) var(--font-body);
    letter-spacing: 0.1em;
    color: var(--fg);
    text-shadow: 0 0 16px rgba(20, 22, 28, 0.95);
    animation: blink 1.8s ease-in-out infinite;
  }
  #title .touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    #title .touch { display: inline; }
    #title .desk { display: none; }
  }
  @keyframes blink { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { #title p { animation: none; } }

  /* 모드 선택 버튼 (메인화면) */
  #modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; pointer-events: auto; }
  #modes button {
    min-height: 48px;
    min-width: 96px;
    padding: 0 22px;
    font: 700 17px var(--font-body);
    background: rgba(20, 22, 28, 0.78);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  #modes button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #modeDesc { font: 500 14px var(--font-body); color: var(--muted); min-height: 1.5em; text-shadow: 0 0 14px rgba(20, 22, 28, 0.95); }

  /* 게임 중: 모드 이름, 이지 모드의 다음 블록 미리보기 */
  #modeTag { color: var(--accent); margin-right: 6px; }
  #next { display: flex; align-items: center; gap: 8px; font: 700 13px var(--font-body); color: var(--muted); }
  #next[hidden] { display: none; }
  #next i { font-style: normal; }
  #next b { font: 400 18px var(--font-display); color: var(--nc, var(--fg)); border: 1.5px solid var(--nc, var(--line)); border-radius: 6px; padding: 2px 8px; }</style>
</head>
<body>

<canvas id="stage" aria-label="엄승식 글자를 쌓아서 같은 색으로 양쪽 벽을 잇는 게임 화면"></canvas>
<div id="bar">
  <p id="hint"><b id="modeTag"></b><kbd>Space</kbd> 떨어뜨리기 · <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 옮기기 · <kbd>R</kbd> 초기화 · 같은 색 글자가 양쪽 벽에 이어지면 사라져요</p>
  <div class="btns">
    <button id="drop" class="primary" type="button">떨어뜨리기</button>
    <button id="reset" type="button">초기화</button>
    <button id="menuBtn" type="button">메인</button>
    <span id="next" hidden><i>다음</i><b>엄승식</b></span>
    <span id="score">0점</span>
  </div>
</div>
<div id="title">
  <h1 aria-label="엄트리스"><span>엄</span><span>트</span><span>리</span><span>스</span></h1>
  <p><span class="desk">스페이스바를 눌러 시작</span><span class="touch">화면을 눌러 시작</span></p>
  <div id="modes" role="radiogroup" aria-label="게임 모드">
    <button type="button" role="radio" data-kind="normal">노멀</button>
    <button type="button" role="radio" data-kind="easy">이지</button>
    <button type="button" role="radio" data-kind="chaos">카오스</button>
  </div>
  <div id="modeDesc"></div>
  <div id="ver"></div>
</div>
<div id="pad">
  <button id="left" type="button" aria-label="왼쪽으로 옮기기">◀</button>
  <button id="drop2" class="primary" type="button">떨어뜨리기</button>
  <button id="right" type="button" aria-label="오른쪽으로 옮기기">▶</button>
</div>

const MAX = 520;              // 화면 위 글자 최대 개수 (카오스는 작은 글자가 많아서 넉넉히)
const FONT = '"Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const { Engine, Bodies, Body, Composite, Sleeping, Events } = Matter;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const barEl = document.getElementById("bar");
const pad = document.getElementById("pad");
const nextEl = document.getElementById("next");
const tagEl = document.getElementById("modeTag");
const descEl = document.getElementById("modeDesc");
const modeBtns = [...document.querySelectorAll("#modes button")];

let W = 0, H = 0, dpr = 1, s = 48, BL = 0, BR = 0, FLOOR = 0;
let mode = "menu";                  // "menu" = 메인화면, "play" = 게임 중
let overAt = 0, nextMenuSpawn = 0, menuMax = 60;
// 게임 모드: 칸 수(판 너비), 블록 크기 배율, 크기 랜덤, 다음 블록 미리보기
const MODES = {
  normal: { name: "노멀",   cols: 9,  scale: 1,   chaos: false, preview: false, colors: 5 },
  easy:   { name: "이지",   cols: 8,  scale: 1,   chaos: false, preview: true, colors: 5 },
  chaos:  { name: "카오스", cols: 14, scale: 1,   chaos: true,  preview: false, colors: 6 }
};
const ORDER = ["normal", "easy", "chaos"];
const DESCS = {
  normal: "기본 규칙",
  easy: "판이 좁고, 다음에 떨어질 색을 미리 보여줘요",
  chaos: "블록 크기가 제각각이고, 판이 넓어요"
};
let kind = "normal";             // 지금 고른 모드
let nextColor = 0;               // 다음에 떨어질 글자 색
const TOUCH = matchMedia("(hover: none) and (pointer: coarse)").matches;
document.body.classList.add("menu");
let group = null, lastDir = 0;            // 지금 떨어지는 중인 엄승식 덩어리
const held = { left: false, right: false };   // 눌려 있는 방향키
let dangerFrames = 0, lineY = 0, dangerLvl = 0;
let engine, letters, particles, floats, clearing, score, over, ending, frame;
const DANGER_FRAMES = 120;    // 선을 넘은 채 버티는 시간 (약 2초)
const FLASH_FRAMES = 54;      // 흰색 깜빡임 3번 (한 번 18프레임)

function init() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  COLS = MODES[kind].cols;
  NCOL = mode === "menu" ? 5 : MODES[kind].colors;
  const padH = mode === "menu" ? 0 : (getComputedStyle(pad).display === "none" ? 0 : pad.offsetHeight);
  FLOOR = H - padH;           // 바닥 위치 (모바일은 버튼 위)
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  s = mode === "menu" ? Math.max(28, Math.min(64, Math.round(W / 22))) : Math.max(19, Math.min(Math.round(37 * MODES[kind].scale), Math.floor((W - 40) / COLS)));   // 글자 한 칸 크기
  BL = mode === "menu" ? 0 : Math.round((W - s * COLS) / 2);                            // 왼쪽 벽 x
  BR = mode === "menu" ? W : BL + s * COLS;                                             // 오른쪽 벽 x

  engine = Engine.create({
    enableSleeping: true,
    positionIterations: 30,     // 물리 계산을 더 촘촘히 해서 아래 글자가 겹치지 않게
    velocityIterations: 16,
    constraintIterations: 4
  });
  engine.gravity.y = 1.4;

  // 부딪히는 순간 젤리처럼 찌그러졌다 출렁이게: 충돌 세기를 글자에 전달
  Events.on(engine, "collisionStart", (e) => {
    for (const pair of e.pairs) {
      const { bodyA: a, bodyB: b } = pair;
      const n = pair.collision.normal;
      const vn = Math.abs((a.velocity.x - b.velocity.x) * n.x + (a.velocity.y - b.velocity.y) * n.y);
      if (vn < 1.2) continue;
      const imp = Math.min(vn, 9) * 0.05;
      for (const body of [a, b]) {
        const j = body.jelly;
        if (!j) continue;
        j.vy -= imp * Math.abs(n.y); j.vx += imp * Math.abs(n.y) * 0.7;
        j.vx -= imp * Math.abs(n.x); j.vy += imp * Math.abs(n.x) * 0.7;
      }
    }
  });
  letters = [];
  particles = [];
  floats = [];
  clearing = [];
  score = 0;
  over = false;
  ending = false;     // 가득 찼을 때 위에서부터 사라지는 중
  group = null;
  frame = 0;
  dangerFrames = 0; dangerLvl = 0;
  nextMenuSpawn = 0;
  menuMax = Math.min(110, Math.floor(W / s) * 3);
  dancer.phase = "idle";
  dancer.x = W + 400;
  nextColor = Math.floor(Math.random() * NCOL);
  showNext();
  updateMenuUI();
  lineY = barEl.getBoundingClientRect().bottom + 22;   // GAME OVER 기준선 (모드마다 막대 높이가 달라서 마지막에 계산)

  const t = 300;
  Composite.add(engine.world, [
    Bodies.rectangle((BL + BR) / 2, FLOOR + t / 2, (BR - BL) + t * 2, t, { isStatic: true, friction: 0.8 }),
    Bodies.rectangle(BL - t / 2, -H, t, H * 4, { isStatic: true, friction: 0.2 }),
    Bodies.rectangle(BR + t / 2, -H, t, H * 4, { isStatic: true, friction: 0.2 })
  ]);
  updateScore();
}

function updateScore() { scoreEl.textContent = score + "점"; }

// ---- 메인화면 / 시작 / 메인으로 돌아가기 ----
function startGame() {
  mode = "play";
  document.body.classList.remove("menu");
  init();
}

function goMenu() {
  mode = "menu";
  document.body.classList.add("menu");
  init();
}

// 스페이스바 / 화면 터치 / 떨어뜨리기 버튼: 메인이면 시작, 게임오버면 다시 시작, 아니면 떨어뜨리기
function action() {
  if (mode === "menu") { startGame(); return; }
  if (over) { if (frame - overAt > 45) startGame(); return; }   // 게임오버 직후 1초는 실수 방지
  spawn();
}

// 메인화면의 모드 선택 표시 (← → / A D 또는 버튼으로 고름)
function updateMenuUI() {
  for (const btn of modeBtns) btn.setAttribute("aria-checked", btn.dataset.kind === kind ? "true" : "false");
  descEl.textContent = DESCS[kind] + (TOUCH ? "" : "  ·  ← → 로 모드 선택");
}

function moveSel(d) {
  kind = ORDER[(ORDER.indexOf(kind) + d + ORDER.length) % ORDER.length];
  updateMenuUI();
}

// 게임 중 상단: 모드 이름, 이지 모드에서는 다음 블록 색 미리보기
function showNext() {
  tagEl.textContent = mode === "play" ? MODES[kind].name : "";
  const on = mode === "play" && MODES[kind].preview;
  nextEl.hidden = !on;
  if (on) nextEl.style.setProperty("--nc", COLORS[nextColor]);
}

const HEAD_ASPECT = 300 / 435;
const dancer = { phase: "idle", x: 0, until: 0, outT: 0, style: "default" };   // style: default | catch   // idle → in → dance → out → idle

function dancerSize() {
  const figH = Math.max(110, Math.min(230, FLOOR * 0.34));
  return { figH, figW: figH * 0.75 };
}

// 줄이 지워질 때 호출: 처음이면 걸어 나오고, 이미 나와 있으면 춤추는 시간을 늘림
function triggerDancer(style) {
  if (mode !== "play") return;
  if (style) dancer.style = style;                                               // 비밀 커맨드가 정한 춤
  else if (dancer.phase === "idle" || dancer.phase === "out") dancer.style = "default";
  if (dancer.phase === "idle" || dancer.phase === "out") {
    if (dancer.phase === "idle") dancer.x = W + dancerSize().figW;
    dancer.until = frame + 240;
    dancer.phase = "in";
  } else {
    dancer.until = Math.min(dancer.until + 150, frame + 420);
  }
}

// 게임오버: 걸어 나와서 무릎을 꿇고 울음 (다시 시작하거나 메인으로 가면 사라짐)
function triggerCry() {
  if (mode !== "play") return;
  if (dancer.phase === "idle") dancer.x = W + dancerSize().figW;
  dancer.phase = "sadIn";
}

// 관절 두 개짜리 팔다리: 시작점에서 목표점까지 닿는 팔꿈치/무릎 위치 (바깥쪽으로 굽힘)
function twoBone(ax, ay, tx, ty, l1, l2, side) {
  let dx = tx - ax, dy = ty - ay;
  let d = Math.hypot(dx, dy) || 0.0001;
  const maxd = l1 + l2 - 0.5;
  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; tx = ax + dx; ty = ay + dy; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const hgt = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + dx * a / d, my = ay + dy * a / d;
  const j1 = { x: mx - dy / d * hgt, y: my + dx / d * hgt };
  const j2 = { x: mx + dy / d * hgt, y: my - dx / d * hgt };
  const j = (j1.x - ax) * side >= (j2.x - ax) * side ? j1 : j2;
  return [{ x: ax, y: ay }, j, { x: tx, y: ty }];
}

const lerp = (a, b, k) => a + (b - a) * k;
const lerpPt = (a, b, k) => ({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) });
const lerpPoly = (a, b, k) => a.map((p, i) => lerpPt(p, b[i], k));

// 기본 자세: dd=0 걷는 중, dd=1 기본 춤 (좌표는 발 아래 가운데가 원점, 위쪽이 -y)
function poseDefault(P, dd, B, Wk) {
  const { L, thigh, shin, uarm, farm, torso } = P;
  const mix = (walk, dance) => walk * (1 - dd) + dance * dd;
  const bob = mix(Math.abs(Math.sin(Wk)) * L * 0.015, (1 - Math.cos(B * 2)) / 2 * L * 0.05);   // 무릎을 굽혔다 폄
  const sway = dd * Math.sin(B) * L * 0.045;                                                   // 몸통 좌우 흔들기
  const hipX = -sway * 0.5, hipY = -(thigh + shin) * 0.97 + bob;
  const shX = sway, shY = hipY - torso;
  // 발: 걸을 땐 번갈아 내딛고, 춤출 땐 번갈아 콩콩 뜀
  const footL = {
    x: mix(-L * 0.06 + Math.sin(Wk) * L * 0.07, -L * 0.13 + hipX),
    y: -mix(Math.max(0, Math.cos(Wk)) * L * 0.05, Math.max(0, Math.sin(B)) * L * 0.06)
  };
  const footR = {
    x: mix(L * 0.06 - Math.sin(Wk) * L * 0.07, L * 0.13 + hipX),
    y: -mix(Math.max(0, -Math.cos(Wk)) * L * 0.05, Math.max(0, -Math.sin(B)) * L * 0.06)
  };
  // 손: 걸을 땐 아래로 늘어뜨리고, 춤출 땐 번갈아 위로 쭉쭉
  const handL = {
    x: mix(shX - L * 0.13, shX - L * (0.17 + 0.06 * Math.sin(B * 0.5))),
    y: mix(shY + L * 0.2 + Math.sin(Wk) * L * 0.02, shY - L * 0.1 - (0.5 + 0.5 * Math.sin(B)) * L * 0.22)
  };
  const handR = {
    x: mix(shX + L * 0.13, shX + L * (0.17 + 0.06 * Math.sin(B * 0.5))),
    y: mix(shY + L * 0.2 - Math.sin(Wk) * L * 0.02, shY - L * 0.1 - (0.5 - 0.5 * Math.sin(B)) * L * 0.22)
  };
  const armL = twoBone(shX, shY, handL.x, handL.y, uarm, farm, -1);
  const armR = twoBone(shX, shY, handR.x, handR.y, uarm, farm, 1);
  const sh = { x: shX, y: shY };
  return {
    hip: { x: hipX, y: hipY }, sh, shL: sh, shR: sh,
    legs: [twoBone(hipX, hipY, footL.x, footL.y, thigh, shin, -1), twoBone(hipX, hipY, footR.x, footR.y, thigh, shin, 1)],
    arms: [armL.concat([armL[2]]), armR.concat([armR[2]])],   // 4번째 점은 손끝 (기본 춤은 손과 같은 점)
    z: [0, 0],
    tilt: mix(Math.sin(Wk) * 0.03, Math.sin(B) * 0.18),
    headDy: 0, cry: 0
  };
}

// 캐치캐치 춤: 발은 어깨너비로 고정하고 무릎을 살짝 굽혀 무게중심을 낮춘 채,
// 팔꿈치를 굽힌 두 팔을 앞으로 들어 어깨→팔꿈치→손목→손끝 순서로 거의 동시에 전후로 흔들고,
// 흉곽은 좌우로 비틀며 골반과 무릎이 같은 박자로 움직여 체중이 한쪽 발로 실림 (3차원 관절 계산 후 앞에서 본 모습으로 그림)
function poseCatch(P, B) {
  const { L, thigh, shin, uarm, farm, torso } = P;
  const sw = L * 0.09;                                    // 어깨 반폭 = 발 간격
  const tw = 0.55 * Math.sin(B * 0.5);                    // 흉곽을 축으로 한 좌우 비틀기
  const cs = Math.cos(tw), sn = Math.sin(tw);
  const shift = Math.sin(B * 0.5);                        // 체중이 실리는 쪽 (-1 왼발 ~ 1 오른발)
  const bob = (1 - Math.cos(B * 2)) / 2 * L * 0.012;      // 팔 박자와 맞춰 무릎을 아주 조금 굽혔다 폄
  const hipX = shift * L * 0.025, hipY = -(thigh + shin) * 0.9 + bob;   // 무릎을 굽혀 낮춘 자세
  const shX = -hipX * 0.8, shY = hipY - torso;            // 골반과 반대로 상체를 보내 균형 유지
  const footL = { x: -sw, y: -Math.max(0, shift) * L * 0.01 };           // 체중이 안 실린 발은 아주 살짝 뜸
  const footR = { x: sw, y: -Math.max(0, -shift) * L * 0.01 };
  const dl = 0.22;                                        // 관절 사이 시간 지연 (작을수록 한 덩어리로 움직임)
  const arm = (sg) => {
    const sz = -sg * sw * sn;                             // 비틀기로 한쪽 어깨는 앞으로, 반대쪽은 뒤로 물러남
    let x = shX + sg * sw * cs, y = shY, z = sz;
    const pts = [{ x, y }];
    const psi = 0.95 + 0.42 * Math.sin(B);                // 위팔을 앞으로 들어 전후로 흔듦
    const psi2 = psi + 1.35 + 0.35 * Math.sin(B - dl);    // 팔꿈치 굽힘 (지연 1)
    const psi3 = psi2 + 0.6 + 0.5 * Math.sin(B - 2 * dl); // 손목/손끝 (지연 2)
    for (const [a, p, len] of [[0.45, psi, uarm], [0.15, psi2, farm], [0.07, psi3, L * 0.05]]) {
      const dx = sg * Math.sin(a), dy = -Math.cos(a) * Math.cos(p), dz = Math.cos(a) * Math.sin(p);   // dy: 위가 +, dz: 앞이 +
      x += (dx * cs + dz * sn) * len;                     // 흉곽이 돈 만큼 팔 전체도 같이 회전
      z += (-dx * sn + dz * cs) * len;
      y -= dy * len;
      pts.push({ x, y });
    }
    return { pts, z };
  };
  const aL = arm(-1), aR = arm(1);
  return {
    hip: { x: hipX, y: hipY }, sh: { x: shX, y: shY }, shL: aL.pts[0], shR: aR.pts[0],
    legs: [twoBone(hipX, hipY, footL.x, footL.y, thigh, shin, -1), twoBone(hipX, hipY, footR.x, footR.y, thigh, shin, 1)],
    arms: [aL.pts, aR.pts],
    z: [aL.z, aR.z],
    tilt: 0.1 * Math.sin(B * 0.5),
    headDy: 0, cry: 0
  };
}

// 무릎 꿇고 우는 자세: 무릎을 땅에 대고 허벅지를 세우고, 어깨를 들썩이며 두 손으로 눈가를 비빔
function poseKneel(P, t) {
  const { L, thigh, torso, uarm, farm } = P;
  const sob = Math.sin(t * 17) * 0.5 + Math.sin(t * 8.5) * 0.5;          // 흐느낌
  const big = Math.pow(Math.max(0, Math.sin(t * 2.6)), 3);              // 가끔 크게 들썩임
  const hipX = 0, hipY = -thigh * 0.96;
  const shX = Math.sin(t * 5) * L * 0.006;
  const shY = hipY - torso * 0.88 + sob * L * 0.008 + big * L * 0.022;    // 상체를 숙이고 어깨가 들썩임
  const kx = L * 0.07;
  const legs = [
    [{ x: hipX, y: hipY }, { x: -kx, y: -1 }, { x: -kx - L * 0.06, y: 0 }],
    [{ x: hipX, y: hipY }, { x: kx, y: -1 }, { x: kx + L * 0.06, y: 0 }]
  ];
  const sL = { x: shX - L * 0.07, y: shY }, sR = { x: shX + L * 0.07, y: shY };
  const wipe = Math.sin(t * 17) * L * 0.012;                             // 눈가를 비비는 손
  const hL = { x: shX - L * 0.115, y: shY - L * 0.2 + wipe }, hR = { x: shX + L * 0.115, y: shY - L * 0.2 - wipe };
  const aL = twoBone(sL.x, sL.y, hL.x, hL.y, uarm, farm, -1);
  const aR = twoBone(sR.x, sR.y, hR.x, hR.y, uarm, farm, 1);
  return {
    hip: { x: hipX, y: hipY }, sh: { x: shX, y: shY }, shL: sL, shR: sR,
    legs, arms: [aL.concat([aL[2]]), aR.concat([aR[2]])], z: [0, 0],
    tilt: 0.1 * Math.sin(t * 2) + sob * 0.025,
    headDy: L * 0.03 + big * L * 0.02,                                    // 고개를 떨굼
    cry: 1
  };
}

function blendPose(a, b, k) {
  return {
    hip: lerpPt(a.hip, b.hip, k), sh: lerpPt(a.sh, b.sh, k), shL: lerpPt(a.shL, b.shL, k), shR: lerpPt(a.shR, b.shR, k),
    legs: [lerpPoly(a.legs[0], b.legs[0], k), lerpPoly(a.legs[1], b.legs[1], k)],
    arms: [lerpPoly(a.arms[0], b.arms[0], k), lerpPoly(a.arms[1], b.arms[1], k)],
    z: [lerp(a.z[0], b.z[0], k), lerp(a.z[1], b.z[1], k)],
    tilt: lerp(a.tilt, b.tilt, k), headDy: lerp(a.headDy, b.headDy, k), cry: lerp(a.cry, b.cry, k)
  };
}

// 눈에서 볼을 따라 흘러내리는 눈물과 "흑흑" (머리 좌표계)
function drawTears(headW, headH, t, k, L) {
  ctx.save();
  ctx.fillStyle = "#8fd3ff";
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const u = (t * 1.3 + i / 3 + (side > 0 ? 0.17 : 0)) % 1;
      ctx.globalAlpha = k * (1 - u * 0.7);
      ctx.beginPath();
      ctx.ellipse(side * headW * (0.22 + 0.06 * u), -headH * 0.6 + u * headH * 0.75, L * 0.011, L * 0.017, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = k * (0.5 + 0.5 * Math.sin(t * 6));
  ctx.font = Math.round(L * 0.08) + "px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("흑흑", headW * 0.62, -headH * 0.95);
  ctx.restore();
}

function drawDancer() {
  if (dancer.phase === "idle") return;
  const { figH: L, figW } = dancerSize();
  const target = (W - BR >= figW + 16) ? BR + (W - BR) / 2 : W - figW / 2 - 6;   // 오른쪽 여백 가운데(좁으면 화면 오른쪽 끝)
  const offX = W + figW;
  let d = 0;                                   // 0 = 걷는 중, 1 = 춤추는 중
  if (dancer.phase === "in") {
    dancer.x += Math.min(-0.8, (target - dancer.x) * 0.04);   // 슬금슬금: 점점 느려지며 들어옴
    const dist = dancer.x - target;
    d = dist < 40 ? 1 - dist / 40 : 0;
    if (dist <= 1) { dancer.x = target; dancer.phase = "dance"; dancer.outT = 0; }
  } else if (dancer.phase === "dance") {
    d = 1;
    if (frame >= dancer.until) dancer.phase = "out";
  } else if (dancer.phase === "sadIn") {
    dancer.x += Math.min(-0.8, (target - dancer.x) * 0.04);   // 풀 죽어서 천천히 걸어 들어옴
    if (dancer.x - target <= 1) { dancer.x = target; dancer.phase = "cry"; dancer.cryT = frame; }
  } else if (dancer.phase === "cry") {
    // 제자리에서 계속 울음 (다시 시작하거나 메인화면으로 가면 사라짐)
  } else if (dancer.phase === "out") {
    dancer.outT++;
    d = Math.max(0, 1 - dancer.outT / 20);
    dancer.x += 3.2;
    if (dancer.x >= offX) { dancer.phase = "idle"; return; }
  }

  const t = frame / 60;
  const B = t * 13.2;                           // 춤 박자
  const sad = dancer.phase === "sadIn" || dancer.phase === "cry";
  const Wk = t * (sad ? 7 : 10);                            // 걸음 박자
  const headH = L * 0.36, headW = headH * HEAD_ASPECT;
  const P = { L, torso: L * 0.26, thigh: L * 0.15, shin: L * 0.15, uarm: L * 0.12, farm: L * 0.12 };
  let pose;
  if (sad) {
    const k = dancer.phase === "cry" ? Math.min(1, (frame - dancer.cryT) / 30) : 0;   // 걷다가 무릎을 꿇음
    pose = blendPose(poseDefault(P, 0, B, Wk), poseKneel(P, t), k * k * (3 - 2 * k));
  } else if (dancer.style === "catch") {
    pose = blendPose(poseDefault(P, 0, B, Wk), poseCatch(P, B), d);   // 걷는 자세에서 캐치캐치 자세로 서서히 바뀜
  } else {
    pose = poseDefault(P, d, B, Wk);
  }
  const { hip, sh, shL, shR, legs, arms, z, tilt } = pose;

  ctx.save();
  ctx.translate(dancer.x, FLOOR);
  ctx.fillStyle = "rgba(0, 0, 0, 0.28)";                      // 바닥 그림자
  ctx.beginPath(); ctx.ellipse(0, 1, L * 0.2, L * 0.025, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const lw = Math.max(3, L * 0.03);
  const strokeAll = (color, width, polys, withTorso) => {
    ctx.strokeStyle = color; ctx.lineWidth = width;
    if (withTorso) {
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(hip.x, hip.y); ctx.stroke();       // 몸통
      ctx.beginPath(); ctx.moveTo(shL.x, shL.y); ctx.lineTo(shR.x, shR.y); ctx.stroke();     // 어깨선
    }
    for (const poly of polys) {
      ctx.beginPath();
      poly.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.stroke();
    }
  };
  const drawLimbs = (polys, withTorso, zs) => {
    strokeAll("rgba(20, 22, 28, 0.9)", lw + 4, polys, withTorso);   // 테두리(블록 위에서도 보이게)
    strokeAll("#e8eaf0", lw, polys, withTorso);
    ctx.fillStyle = "#e8eaf0";
    polys.forEach((poly, i) => {                                    // 손발 끝 (앞으로 나온 손은 조금 크게)
      const e = poly[poly.length - 1];
      const r = lw * Math.max(0.7, Math.min(1.7, 0.9 * (1 + 2 * (zs ? zs[i] : 0) / L)));
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
    });
  };
  drawLimbs(legs, true);                                              // 몸통과 다리
  ctx.save();                                                         // 머리(사진): 박자에 맞춰 갸우뚱
  ctx.translate(sh.x, sh.y - L * 0.02 + pose.headDy);
  ctx.rotate(tilt);
  if (HEAD.complete && HEAD.naturalWidth) ctx.drawImage(HEAD, -headW / 2, -headH, headW, headH);
  else { ctx.fillStyle = "#e8c8a8"; ctx.beginPath(); ctx.arc(0, -headH / 2, headH / 2, 0, Math.PI * 2); ctx.fill(); }
  if (pose.cry > 0.4) drawTears(headW, headH, t, pose.cry, L);
  ctx.restore();
  drawLimbs(arms, false, z);                                          // 팔은 얼굴 앞에 그려서 손동작이 보이게
  ctx.restore();
}

// 메인화면에서 블록을 랜덤한 위치에서 계속 떨어뜨림
function menuSpawn() {
  const c = Math.floor(Math.random() * NCOL);
  if (Math.random() < 0.6) {
    const x0 = s * 0.6 + Math.random() * Math.max(1, W - s * 3.2);
    CHARS.forEach((ch, i) => spawnOne(ch, x0 + i * s, c));
  } else {
    const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
    spawnOne(ch, s * 0.6 + Math.random() * Math.max(1, W - s * 1.2), c);
  }
}

function menuTick() {
  if (frame >= nextMenuSpawn) {
    menuSpawn();
    nextMenuSpawn = frame + 20 + Math.floor(Math.random() * 40);
  }
  let removed = false;
  while (letters.length > menuMax) {      // 너무 많아지면 오래된 것부터 흩어지며 사라짐
    const b = letters.shift();
    burst(b);
    Composite.remove(engine.world, b);
    removed = true;
  }
  if (removed) for (const b of letters) Sleeping.set(b, false);
}

function spawnOne(ch, x, c, sz = s) {
  const body = Bodies.rectangle(x, -sz, sz * 0.96, sz * 0.96, {
    chamfer: { radius: sz * 0.12 },
    restitution: 0.7,           // 통통 튜는 정도 (높을수록 더 튝)
    slop: 0.02,                 // 겹침 허용치를 줄임
    friction: 0.5,
    frictionStatic: 0.6,
    frictionAir: 0.01,
    angle: (Math.random() - 0.5) * 0.4
  });
  Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.05);
  body.glyph = {
    ch,
    c
  };
  body.born = frame;
  body.sz = sz;                                // 이 블록의 크기 (카오스 모드는 제각각)
  body.jelly = { x: 0, y: 0, vx: 0, vy: 0 };   // 찌그러짐 상태(늘어난 정도와 속도)
  Composite.add(engine.world, body);
  letters.push(body);
  return body;
}

// 스페이스바 한 번에 엄·승·식 세 글자가 한 줄로 함께 떨어짐 (색은 한 번에 하나)
function spawn() {
  if (over || ending || letters.length + CHARS.length > MAX) return;
  const sizes = CHARS.map(() => (MODES[kind].chaos ? s * (0.5 + Math.random() * 1.2) : s));
  const total = sizes.reduce((a, v) => a + v, 0);
  const x0 = BL + 2 + Math.random() * Math.max(1, (BR - BL) - total - 4);
  const c = Math.floor(Math.random() * NCOL);   // 세 글자는 같은 색
  const cc = nextColor;                       // 미리 보여준 색으로 떨어뜨림
  nextColor = Math.floor(Math.random() * NCOL);
  showNext();
  let x = x0;
  group = CHARS.map((ch, i) => { const b = spawnOne(ch, x + sizes[i] / 2, cc, sizes[i]); x += sizes[i]; return b; });
  if (MODES[kind].chaos && Math.random() < TROLL_P) {   // 가끔 글자 하나가 방해꾼 머리로 바뀜 (색도 없고, 줄도 안 맞춰지고, 안 사라짐)
    const tb = group[Math.floor(Math.random() * group.length)];
    tb.glyph = { ch: "", c: -1, troll: true };
  }
}

// 거의 멈춰 있는 글자만 줄 판정에 사용
function isStill(b) {
  if (b.flashing) return false;
  if (b.isSleeping) return true;
  return frame - b.born > 30 && b.speed < 0.25 && Math.abs(b.angularSpeed) < 0.01;
}

// 같은 색 글자가 서로 맞닿아 왼쪽 벽 ~ 오른쪽 벽까지 이어진 길을 찾음
function findPath() {
  const still = letters.filter(isStill);
  const tol = s * 0.15;       // 벽에 닿았다고 보는 오차
  const reach = s * 1.2;      // 글자끼리 맞닿았다고 보는 중심 거리
  for (let c = 0; c < NCOL; c++) {
    const g = still.filter((b) => b.glyph.c === c);
    if (g.length < 4) continue;
    const prev = new Map();
    const queue = [];
    for (const b of g) {
      if (b.bounds.min.x <= BL + tol) { prev.set(b, null); queue.push(b); }
    }
    for (let i = 0; i < queue.length; i++) {
      const a = queue[i];
      if (a.bounds.max.x >= BR - tol) {
        const path = [];
        for (let n = a; n; n = prev.get(n)) path.push(n);
        return path;
      }
      for (const b of g) {
        if (prev.has(b)) continue;
        if (Math.hypot(a.position.x - b.position.x, a.position.y - b.position.y) <= (a.sz + b.sz) / 2 * 1.2) {
          prev.set(b, a);
          queue.push(b);
        }
      }
    }
  }
  return null;
}

// 줄이 맞으면 먼저 제자리에 고정해서 흰색으로 3번 깜빡인 뒤 사라짐
function clearPath(path) {
  for (const b of path) {
    b.flashing = true;
    b.flashStart = frame;
    Body.setStatic(b, true);
  }
  clearing.push(path);
}

function finishClear(path) {
  let cx = 0, cy = 0;
  for (const b of path) {
    cx += b.position.x; cy += b.position.y;
    for (let i = 0; i < 18; i++) {      // 모래처럼 흩어지는 알갱이
      particles.push({
        x: b.position.x + (Math.random() - 0.5) * s,
        y: b.position.y + (Math.random() - 0.5) * s,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 3,
        life: 30 + Math.random() * 30,
        color: COLORS[b.glyph.c] || "#e8eaf0"
      });
    }
    Composite.remove(engine.world, b);
    letters.splice(letters.indexOf(b), 1);
  }
  floats.push({ x: cx / path.length, y: cy / path.length, life: 60 });
  triggerDancer();
  score += POINTS;
  updateScore();
  for (const b of letters) Sleeping.set(b, false);   // 빈자리로 글자들이 무너져 내림
}

function burst(b) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: b.position.x + (Math.random() - 0.5) * s,
      y: b.position.y + (Math.random() - 0.5) * s,
      vx: (Math.random() - 0.5) * 3,
      vy: -Math.random() * 3,
      life: 25 + Math.random() * 25,
      color: COLORS[b.glyph.c] || "#e8eaf0"
    });
  }
}

// 가득 찼을 때: 가장 위에 있는 한 줄씩 흩어지며 사라지고, 다 사라지면 GAME OVER
function dissolveTop() {
  if (letters.length === 0) { ending = false; over = true; overAt = frame; triggerCry(); return; }
  let minY = Infinity;
  for (const b of letters) if (b.position.y < minY) minY = b.position.y;
  for (let i = letters.length - 1; i >= 0; i--) {
    const b = letters[i];
    if (b.position.y <= minY + s * 0.6) {
      burst(b);
      Composite.remove(engine.world, b);
      letters.splice(i, 1);
    }
  }
}

function roundRectPath(x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  else { ctx.beginPath(); ctx.rect(x, y, w, h); }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 판 바탕과 양옆 벽
  if (mode === "play") {
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    ctx.fillRect(BL, 0, BR - BL, FLOOR);
    ctx.fillStyle = "#3a3f50";
    ctx.fillRect(BL - 4, 0, 4, FLOOR);
    ctx.fillRect(BR, 0, 4, FLOOR);
    ctx.fillRect(BL - 4, FLOOR, BR - BL + 8, 4);
  }

  // GAME OVER 기준선 (가까워지면 빨개지고, 넘으면 깜빡임)
  if (mode === "play" && !over) {
    const over_ = dangerFrames > 0;
    const k = over_ ? 1 : dangerLvl;
    const blink = 1;
    const kc = k * 0.4;   // 색은 살짝만 붉어짐 (가장 위험할 때가 이 정도)
    const r = Math.round(150 + 105 * kc), g = Math.round(155 - 95 * kc), bl = Math.round(170 - 100 * kc);
    ctx.save();
    ctx.strokeStyle = `rgba(${r},${g},${bl},${(0.35 + 0.6 * k) * blink})`;
    ctx.lineWidth = 2 + 2 * k;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(BL, lineY); ctx.lineTo(BR, lineY); ctx.stroke();
    ctx.restore();
  }

  // 글자
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = Math.round(s * 0.74) + "px " + FONT;
  const A = mode === "menu" ? 0.6 : 1;      // 메인화면의 블록은 제목이 읽히도록 조금 흐리게
  for (const b of letters) {
    const flashWhite = b.flashing && Math.floor((frame - b.flashStart) / 9) % 2 === 1;
    const col = flashWhite ? "#ffffff" : (COLORS[b.glyph.c] || "#e8eaf0");
    ctx.save();
    const j = b.jelly;
    j.vx += -0.22 * j.x - 0.1 * j.vx;      // 스프링으로 원래 모양에 돌아옴
    j.vy += -0.22 * j.y - 0.1 * j.vy;
    j.x = Math.max(-0.35, Math.min(0.35, j.x + j.vx));
    j.y = Math.max(-0.35, Math.min(0.35, j.y + j.vy));
    ctx.translate(b.position.x, b.position.y);
    ctx.scale(1 + j.x, 1 + j.y);
    ctx.rotate(b.angle);
    if (b.glyph.troll) {    // 방해꾼: 글자 대신 머리 그림
      ctx.shadowColor = "rgba(255,255,255,0.6)"; ctx.shadowBlur = 4;
      const hs = b.sz * 1.0;
      if (TROLL.complete && TROLL.naturalWidth) ctx.drawImage(TROLL, -hs / 2, -hs / 2, hs, hs);
      ctx.restore();
      continue;
    }
    ctx.font = Math.round(b.sz * 0.74) + "px " + FONT;
    const half = b.sz * 0.48;
    roundRectPath(-half, -half, half * 2, half * 2, b.sz * 0.12);
    ctx.globalAlpha = 0.2 * A;
    ctx.fillStyle = col;
    ctx.fill();
    ctx.globalAlpha = 0.55 * A;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = A;
    ctx.fillStyle = col;
    ctx.fillText(b.glyph.ch, 0, 1);
    ctx.restore();
  }

  // 흩어지는 알갱이
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;

  // +100 표시
  ctx.font = "26px " + FONT;
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 0.8; f.life--;
    if (f.life <= 0) { floats.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, f.life / 20);
    ctx.fillStyle = "#ffd23f";
    ctx.fillText("+" + POINTS, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (over) {
    ctx.fillStyle = "rgba(20,22,28,0.72)";
    ctx.fillRect(BL, 0, BR - BL, H);
    ctx.fillStyle = "#e8eaf0";
    ctx.font = "34px " + FONT;
    ctx.fillText("GAME OVER", (BL + BR) / 2, H / 2 - 30);
    ctx.fillStyle = "#8a90a0";
    ctx.font = "700 15px " + FONT;
    ctx.fillText("점수 " + score + "점", (BL + BR) / 2, H / 2 + 6);
    ctx.fillText(TOUCH ? "화면을 눌러 다시 시작" : "스페이스바: 다시 시작", (BL + BR) / 2, H / 2 + 32);
    ctx.fillText(TOUCH ? "메인 버튼: 메인화면" : "R: 메인화면", (BL + BR) / 2, H / 2 + 56);
  }

  // 캐릭터는 맨 위에 그림 (블록과 GAME OVER 어둠막 뒤로 가려지지 않게)
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = Math.round(s * 0.74) + "px " + FONT;
  drawDancer();
}

// 떨어지는 중인 덩어리를 방향키로 좌우로 옮김 (바닥이나 글자에 닿으면 조종 끝)
function steer() {
  if (!group) return;
  if (over || ending) { group = null; return; }
  const landed = group.some((b) => b.isSleeping || (frame - b.born > 20 && b.speed < 0.3));
  if (landed) { group = null; lastDir = 0; return; }
  const dir = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (dir !== 0 || lastDir !== 0) {
    for (const b of group) Body.setVelocity(b, { x: dir * s * 0.09, y: b.velocity.y });
  }
  lastDir = dir;
}

function tick() {
  steer();
  frame++;
  Engine.update(engine, 1000 / 120);   // 한 프레임을 두 번으로 쪼개서 계산
  Engine.update(engine, 1000 / 120);
  for (let i = clearing.length - 1; i >= 0; i--) {
    const path = clearing[i];
    if (frame - path[0].flashStart >= FLASH_FRAMES) {
      clearing.splice(i, 1);
      finishClear(path);
    }
  }
  if (mode === "menu") menuTick();
  if (mode === "play" && !over && !ending && frame % 5 === 0) {
    let path, guard = 0;
    while (guard++ < 3 && (path = findPath())) clearPath(path);
    // 멈춰 있는 글자 중 가장 높은 곳과 기준선 사이 거리로 위험도 계산
    let minTop = Infinity;
    for (const b of letters) if (isStill(b) && b.bounds.min.y < minTop) minTop = b.bounds.min.y;
    const gap = minTop - lineY;
    dangerLvl = Math.max(0, Math.min(1, 1 - gap / (s * 4)));   // 선에서 글자 4칸 안쪽부터 점점 빨개짐
    if (gap < 0) dangerFrames += 5; else dangerFrames = Math.max(0, dangerFrames - 10);   // 선을 넘은 채로 약 2초 버티면 끝
    if (dangerFrames >= DANGER_FRAMES) {
      ending = true;
      clearing = [];
    }
  }
  if (ending && frame % 4 === 0) dissolveTop();
  draw();
}

// 화면 주사율(60/90/120Hz)과 상관없이 게임이 초당 60틱으로 똑같이 돌아가게 함
let lastT = 0, acc = 0;
const TICK_MS = 1000 / 60;
function loop(ts) {
  if (ts === undefined) ts = performance.now();
  const dt = lastT ? Math.min(100, ts - lastT) : TICK_MS;
  lastT = ts;
  acc += dt;
  let n = 0;
  while (acc >= TICK_MS - 0.5 && n < 2) { tick(); acc -= TICK_MS; n++; }
  if (acc > TICK_MS * 2) acc = 0;
  requestAnimationFrame(loop);
}

const DIR_KEYS = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
// 비밀 커맨드(게임 중, 점수는 오르지 않음): D S A D = 기본 춤, A W D S A = 캐치캐치 춤
const SECRETS = [
  { keys: ["KeyD", "KeyS", "KeyA", "KeyD"], style: "default" },
  { keys: ["KeyA", "KeyW", "KeyD", "KeyS", "KeyA"], style: "catch" }
];
let secretBuf = [], secretAt = 0;
window.addEventListener("keydown", (e) => {
  if (!e.repeat && mode === "play" && !over) {
    const now = performance.now();
    if (now - secretAt > 1500) secretBuf = [];      // 키 사이가 1.5초 넘으면 처음부터
    secretAt = now;
    secretBuf.push(e.code);
    if (secretBuf.length > 5) secretBuf.shift();
    for (const sc of SECRETS) {
      if (secretBuf.length >= sc.keys.length && secretBuf.slice(-sc.keys.length).join() === sc.keys.join()) {
        secretBuf = [];
        triggerDancer(sc.style);
        break;
      }
    }
  }
  if (DIR_KEYS[e.code]) {
    e.preventDefault();
    if (mode === "menu") { if (!e.repeat) moveSel(DIR_KEYS[e.code] === "left" ? -1 : 1); return; }   // 메인화면: 모드 선택
    held[DIR_KEYS[e.code]] = true;
    return;
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (!e.repeat) action();
  } else if (e.key === "r" || e.key === "R" || e.key === "ㄱ") {
    if (mode === "play") { if (over) goMenu(); else init(); }   // 게임오버에서 R = 메인화면
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") e.preventDefault();
  if (DIR_KEYS[e.code]) held[DIR_KEYS[e.code]] = false;
});
window.addEventListener("blur", () => { held.left = held.right = false; });
canvas.addEventListener("pointerdown", action);
document.getElementById("drop").addEventListener("click", action);
document.getElementById("menuBtn").addEventListener("click", goMenu);
for (const btn of modeBtns) btn.addEventListener("click", () => { kind = btn.dataset.kind; startGame(); });
document.getElementById("reset").addEventListener("click", init);

// 모바일 버튼: 누르고 있는 동안 옮김
function bindHold(id, key) {
  const el = document.getElementById(id);
  const off = () => { held[key] = false; };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); held[key] = true; });
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("pointerleave", off);
}
bindHold("left", "left");
bindHold("right", "right");
document.getElementById("drop2").addEventListener("click", action);
window.addEventListener("resize", init);

init();
const start = () => loop();
if (document.fonts && document.fonts.load) {
  document.fonts.load('40px "Black Han Sans"', CHARS.join("") + "엄트리스").then(start, start);
} else {
  start();
}
</script>
</body>
