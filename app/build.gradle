plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umtris.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.umtris.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 고정 서명: 매번 같은 서명으로 만들어서, 새 APK를 지우지 않고 덮어 설치할 수 있음 (테스트용 서명)
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
